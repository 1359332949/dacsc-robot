name: TTA unit tests

on:
  push:
    branches: [main, "exp/**"]
    paths:
      - "dacsc/target_only_mean.py"
      - "dacsc/action_guard.py"
      - "dacsc/state_pairing.py"
      - "dacsc/observation_render.py"
      - "dacsc/libero_noise.py"
      - "tests/test_target_only_mean.py"
      - "tests/test_state_pairing.py"
      - "tests/test_import_smoke.py"
      - "tests/test_view_residual_diagnostic.py"
      - "tests/test_pilot_validation.py"
      - "dacsc/pilot_validation.py"
      - "dacsc/tta_protocol.py"
      - "tests/test_tta_protocol.py"
      - "dacsc/failure_monitor.py"
      - "tests/test_failure_monitor.py"
      - "tests/test_monitor_artifact.py"
      - "scripts/build_monitor_dataset.py"
      - "scripts/train_failure_monitor.py"
      - "scripts/evaluate_monitor_offline.py"
      - "scripts/monitor_recovery_eval.py"
      - "scripts/collect_monitor_data.py"
      - "scripts/run_monitor_pipeline.py"
      - "scripts/target_only_action_validation.py"
      - "scripts/view_residual_diagnostic.py"
      - "scripts/closed_loop_tta_pilot.py"
      - ".github/workflows/tta-unit-tests.yml"
  pull_request:
    paths:
      - "dacsc/target_only_mean.py"
      - "dacsc/action_guard.py"
      - "dacsc/state_pairing.py"
      - "dacsc/observation_render.py"
      - "dacsc/libero_noise.py"
      - "tests/test_target_only_mean.py"
      - "tests/test_state_pairing.py"
      - "tests/test_import_smoke.py"
      - "tests/test_view_residual_diagnostic.py"
      - "tests/test_pilot_validation.py"
      - "dacsc/pilot_validation.py"
      - "dacsc/tta_protocol.py"
      - "tests/test_tta_protocol.py"
      - "dacsc/failure_monitor.py"
      - "tests/test_failure_monitor.py"
      - "tests/test_monitor_artifact.py"
      - "scripts/build_monitor_dataset.py"
      - "scripts/train_failure_monitor.py"
      - "scripts/evaluate_monitor_offline.py"
      - "scripts/monitor_recovery_eval.py"
      - "scripts/collect_monitor_data.py"
      - "scripts/run_monitor_pipeline.py"
      - "scripts/target_only_action_validation.py"
      - "scripts/view_residual_diagnostic.py"
      - "scripts/closed_loop_tta_pilot.py"
      - ".github/workflows/tta-unit-tests.yml"

jobs:
  target-only-mean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile TTA modules and diagnostic script
        run: python -m py_compile dacsc/target_only_mean.py dacsc/action_guard.py dacsc/state_pairing.py dacsc/observation_render.py dacsc/libero_noise.py dacsc/tta_protocol.py dacsc/failure_monitor.py scripts/build_monitor_dataset.py scripts/train_failure_monitor.py scripts/evaluate_monitor_offline.py scripts/monitor_recovery_eval.py scripts/target_only_action_validation.py scripts/view_residual_diagnostic.py scripts/closed_loop_tta_pilot.py
      - name: Import smoke tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_import_smoke -v
      - name: State pairing tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_state_pairing -v
      - name: Pilot validation tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_pilot_validation -v
      - name: TTA protocol tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_tta_protocol -v
      - name: Failure monitor tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_failure_monitor -v
      - name: Monitor artifact tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_monitor_artifact -v
      - name: View residual diagnostic test
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_view_residual_diagnostic -v
      - name: Run target-only mean tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_target_only_mean.py" -v
