name: Static visual V2 protocol tests
on:
  push:
    branches: [main, "fix/patch-freshness-v1", "codex/**"]
    paths:
      - "dacsc/static_visual_v2.py"
      - "scripts/static_visual_v2.py"
      - "tests/test_static_visual_v2.py"
      - ".github/workflows/static-visual-v2.yml"
  pull_request:
    paths:
      - "dacsc/static_visual_v2.py"
      - "scripts/static_visual_v2.py"
      - "tests/test_static_visual_v2.py"
      - ".github/workflows/static-visual-v2.yml"
jobs:
  protocol-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pillow
      - run: python -m unittest tests.test_static_visual_v2 -v
