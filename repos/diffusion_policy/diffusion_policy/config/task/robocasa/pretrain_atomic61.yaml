  domain_batch_size: 30
  domain_id_min: 11
  domain_group_size: 1
  domain_samples_per_group: 3
  domain_max_groups_per_batch: 10
  # Protocol B: train/val/test styles are disjoint.
  train_style_min: 11
  train_style_max: 30
  val_style_min: 31
  val_style_max: 40
  test_style_min: 41
  test_style_max: 50
  reserved_style_min: 51
  reserved_style_max: 60
  val_max_steps: 2048
  test_max_steps: 2048
  # Fit state normalization on training styles only (no val/test statistics).
  train_only_normalizer: true
  normalizer_max_steps: 512

  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  use_legacy_normalizer: False
  use_cache: True
  seed: 42
  val_ratio: 0.02
