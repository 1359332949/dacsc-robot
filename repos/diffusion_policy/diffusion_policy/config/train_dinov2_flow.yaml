# DACSC-Robot：DINOv2 观测编码器版本（新文件，不修改官方任何配置）
# 用法：python train.py --config-name=train_dinov2_bs192 task=robocasa/pretrain_human300
# 依据：CoRP（arXiv 2610.08183）4.3/4.4 —— DINOv2 预训练 ViT-S/14 + 联合微调
defaults:
  - _self_
  - task: robocasa/pretrain_human300

name: train_dinov2_flow
_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "dinov2_flow"

horizon: 10
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True

policy:
  _target_: dacsc.policy.RoboCasaDINOv2Policy

  shape_meta: ${shape_meta}

  # Kept only for the official base-class constructor. The flow path ignores it.
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 10

  # ---- DINOv2 观测编码器（我们的）----
  dino_backbone: dinov2_vits14     # CoRP 用的就是它（22.1M）
  crop_size: 224                   # 必须是 14 的倍数（256 会报错）
  view_feat_dim: 256              # ignored by resampler path
  low_dim_feat_dim: 128
  feature_dim: 256                # ignored by resampler path; token_dim=resampler_dim
  freeze_dino: False               # ★ CoRP 4.4：冻结会掉约 20 分，必须联合微调
  freeze_obs_encoder: false        # frozen_encoder_head baseline, not strict DFR
  use_resampler: true              # CoRP-style learned-query token compressor
  resampler_num_queries: 48
  resampler_dim: 64
  resampler_heads: 6
  resampler_dropout: 0.0
  # ---- token-level style statistics (requires use_resampler) ----
  token_style_mode: none    # none | random_stats | cross_style_stats | cross_style_stats_action_aware
  token_style_alpha: 0.5
  token_style_action_weight: 1.0
  token_style_protect_ratio: 0.0
  token_style_importance_every: 4
  token_style_momentum: 0.9
  token_style_diagnostics_every: 50
  flow_matching: true              # rectified-flow action head
  flow_time_scale: 1000.0
  dino_pretrained: True            # 消融：false = 随机初始化 ViT-S/14
  dino_unfreeze_last_n_blocks: null # 消融：4 = 只微调最后 4 个 block
  random_crop: True
  pool: mean

  # ---- ★ 通道门控（soft 为旧消融，hard 为 v2 主方法）----
  enable_gating: True
  gate_mode: hard                 # hard = per-sample top-k hard mask + STE
  hard_layer_indices: [11]        # v2 probe: 先固定最后一层；null = 随机 1 层
  hard_drop_ratio: 0.33
  hard_mask_temperature: 0.1
  hard_mask_mode: gumbel_ste     # topk_ste 保留作基线
  hard_mask_domain_shared: true  # 同 style 共享 Gumbel 噪声，保持域结构
  hard_selection_mode: two_stage  # 域候选内再保护动作通道
  hard_candidate_ratio: 0.6
  hard_action_protect_ratio: 0.2
  hard_wrs_recover: true            # DgCD/DomainDrop WRS recovery switch
  hard_wrs_normalize: per_sample    # per_sample | global | none
  hard_action_lambda: 1.0
  hard_domain_mode: dgcd          # dgcd = per-sample 分布差异；classifier = 弱分类器消融
  hard_domain_lambda: 0.1          # 仅 classifier 模式使用
  hard_domain_grl: 0.25
  hard_consistency_weight: 0.0     # 特征 MSE 不是最终 consistency，先关闭
  hard_clean_importance_every: 4  # 每 4 步 clean forward 估 Taylor v
  hard_train_only: true           # 训练时 dropout，推理默认关闭
  domain_id_min: 11                # pretrain style_id 11..60
  domain_group_size: 1             # 单 style 一个域
  domain_head_lr: 1.0e-3            # 50 类域头，先用 1e-3
  gate_layer_indices: null      # soft 模式：null = 全部 12 层
  gate_init: 0.999              # 初始接近恒等（验证过：相对差 5e-6，注入无害）
  num_domains: 50               # 单 style 一个域
  gate_rho_max: 0.3             # 目标平均抑制比例
  gate_rho_warmup_steps: 10000  # 渐进抑制（借鉴 PLACE）
  gate_lambda_d: 1.0            # 域敏感项权重
  gate_lambda_a: 1.0            # 动作保护项权重
  gate_lambda_rho: 1.0          # 预算项权重
  gate_stats_momentum: 0.99
  use_action_importance: True
  # ★ 打分与重要性：默认用「移植自开源实现」的版本（详见 notes/22）
  domain_score_mode: dgcd        # dgcd = DgCD 官方实现移植（CIMM'24, MIT）
                                 # kl_gauss = 我们早期自研的逐通道高斯 KL（消融对照）
  dgcd_rho: 0.05                 # DgCD 官方量级（soft/DgCD 消融）
  dgcd_group_smooth: 1.0         # 同 style 内共享域分数
  dgcd_domain_center: true        # 去掉跨域共享通道成分
  layout_residual: true           # domain score 去掉 layout/view 均值
  layout_id_min: 11
  layout_num: 50
  layout_stats_momentum: 0.99
  token_score_pool: meanmax        # token-level mean+max
  action_importance_impl: rsc    # rsc = 梯度分位数；taylor = EMA
                                 # rsc    = 梯度分位数掩码（DomainBed RSC, MIT）
  rsc_drop_fraction: 0.3
  lambda_coral: 0.0              # >0 时加入 Deep CORAL（移植自 DomainBed, MIT）
  gate_weight_decay: 0.0
  # ★ 门控学习率必须显著高于主 lr：初始 g=0.999 处 sigmoid 已饱和，
  #   dg/dη ≈ 0.001，g 空间的实际步长只有 lr×0.001。设为 1e-2 相当于把
  #   g 空间步长拉回到 ~1e-5/步，长训练下才能收敛到有效抑制。
  gate_learning_rate: 1.0e-2     # soft 模式门控 lr
  gate_diagnostics_every: 50      # full IoU/cosine diagnostics every N steps

  # ---- DiT（与官方 bs192 一致）----
  n_layer: 12
  n_cond_layers: 4
  n_head: 8
  n_emb: 512
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: True
  time_as_cond: True
  obs_as_cond: ${obs_as_cond}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 30            # safe default; official 192 may OOM with resampler/flow
  num_workers: 8          # 官方为 64，本机建议降低
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 8             # safe default for held-out validation
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  learning_rate: 1.0e-4          # DiT / 投影层
  obs_encoder_learning_rate: 1.0e-5  # DINOv2 主干，约 10x 更小
  domain_head_lr: 1.0e-3            # v2 hard 模式域分类器
  betas: [0.9, 0.95]

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 1              # max_train_steps is PER EPOCH
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: null
  checkpoint_every: 100
  val_every: 50             # epoch-level, not step-level
  sample_every: 50
  max_train_steps: 51       # per epoch; default total = 51 with num_epochs=1
  max_val_steps: 32         # 32 batches × val batch_size(8) = 256 samples
  tqdm_interval_sec: 1.0

logging:
  project: dacsc_dinov2
  resume: False
  mode: disabled           # 机制实验不初始化 W&B/OTel
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 20
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

# ---- ★ 数据集：换成带域标签（style_id / layout_id）的版本 ----
# 官方 task 配置里的 dataset._target_ 是 LerobotCotrainingDataset，
# 这里覆盖成我们的子类（不改官方文件，只在本配置里覆盖）。
task:
  dataset:
    _target_: dacsc.dataset.DomainLerobotCotrainingDataset

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
