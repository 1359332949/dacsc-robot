name: train_dinov2_flow
_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace
task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: dinov2_flow
horizon: 10
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_cond: true
policy:
  _target_: dacsc.policy.RoboCasaDINOv2Policy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 10
  dino_backbone: dinov2_vits14
  crop_size: 224
  view_feat_dim: 256
  low_dim_feat_dim: 128
  feature_dim: 256
  freeze_dino: false
  freeze_obs_encoder: false
  use_resampler: true
  resampler_num_queries: 48
  resampler_dim: 64
  resampler_heads: 6
  resampler_dropout: 0.0
  token_style_mode: none
  token_style_stage: resampler
  token_style_stats: meanstd
  token_style_alpha: 0.5
  token_style_action_weight: 1.0
  token_style_protect_ratio: 0.0
  token_style_importance_every: 4
  token_style_momentum: 0.9
  token_style_diagnostics_every: 50
  flow_matching: true
  flow_time_scale: 1000.0
  dino_pretrained: true
  dino_unfreeze_last_n_blocks: null
  random_crop: false
  pool: mean
  enable_gating: false
  gate_mode: hard
  hard_layer_indices:
  - 11
  hard_drop_ratio: 0.33
  hard_mask_temperature: 0.1
  hard_mask_mode: gumbel_ste
  hard_mask_domain_shared: false
  hard_selection_mode: linear
  hard_candidate_ratio: 0.6
  hard_action_protect_ratio: 0.2
  hard_wrs_recover: true
  hard_wrs_normalize: per_sample
  hard_action_lambda: 1.0
  hard_domain_mode: random
  hard_domain_lambda: 0.1
  hard_domain_grl: 0.25
  hard_consistency_weight: 0.0
  hard_clean_importance_every: 4
  hard_train_only: true
  domain_id_min: 11
  domain_group_size: 1
  domain_head_lr: 0.001
  gate_layer_indices: null
  gate_init: 0.999
  num_domains: 20
  gate_rho_max: 0.3
  gate_rho_warmup_steps: 10000
  gate_lambda_d: 1.0
  gate_lambda_a: 1.0
  gate_lambda_rho: 1.0
  gate_stats_momentum: 0.99
  use_action_importance: false
  domain_score_mode: dgcd
  dgcd_rho: 0.05
  dgcd_group_smooth: 0.0
  dgcd_domain_center: false
  layout_residual: true
  layout_id_min: 11
  layout_num: 50
  layout_stats_momentum: 0.99
  token_score_pool: meanmax
  action_importance_impl: rsc
  rsc_drop_fraction: 0.3
  lambda_coral: 0.0
  gate_weight_decay: 0.0
  gate_learning_rate: 0.01
  gate_diagnostics_every: 50
  n_layer: 12
  n_cond_layers: 4
  n_head: 8
  n_emb: 512
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  time_as_cond: true
  obs_as_cond: ${obs_as_cond}
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 30
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: false
optimizer:
  transformer_weight_decay: 0.001
  obs_encoder_weight_decay: 1.0e-06
  learning_rate: 0.0001
  obs_encoder_learning_rate: 1.0e-05
  domain_head_lr: 0.001
  betas:
  - 0.9
  - 0.95
training:
  device: cuda:0
  seed: 43
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 20
  num_epochs: 1
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: null
  checkpoint_every: 1000
  val_every: 50
  val_every_steps: 0
  sample_every: 1000
  max_train_steps: 200
  max_val_steps: 32
  max_test_steps: 32
  tqdm_interval_sec: 1.0
logging:
  project: dacsc_dinov2
  resume: false
  mode: disabled
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  id: null
  group: null
checkpoint:
  topk:
    monitor_key: val_action_mse
    mode: min
    k: 0
    format_str: global_step={global_step:06d}-val_action_mse={val_action_mse:.6f}.ckpt
  save_last_ckpt: false
  save_last_snapshot: false
multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
